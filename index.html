<title>入园适应记录</title>
<style>
:root{
  --ink:#1F2A28; --deep:#14513F; --green:#2E7D6B; --tint:#F1F7F4; --line:#D6E6DF;
  --warn:#C2703D; --warntint:#FDF6F2; --muted:#7A8C87; --bg:#F5F8F7; --card:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
#app{max-width:560px;margin:0 auto;padding:0 14px 104px}
.top{padding-top:calc(env(safe-area-inset-top) + 14px);padding-bottom:10px}
.top h1{margin:0;font-size:20px;font-weight:700;color:var(--deep);letter-spacing:.3px}
.top .sub{margin-top:2px;font-size:12px;color:var(--muted)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(20,81,63,.06),0 6px 18px -12px rgba(20,81,63,.25)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.sec{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--deep);margin:0 0 10px}
.sec::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--green);flex:0 0 auto}
.sec em{font-style:normal;font-weight:400;font-size:11.5px;color:var(--muted)}
.datepick{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.datepick input[type=date]{flex:1;min-width:140px;font:inherit;font-size:14px;padding:9px 10px;
  border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:64px;font:inherit;font-size:14px;padding:10px 6px;border-radius:10px;
  border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:.12s}
.seg button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.seg button:active{transform:scale(.97)}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;padding:4px 0}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;
  font-size:22px;line-height:1;color:var(--green);cursor:pointer;display:flex;align-items:center;justify-content:center}
.stepper button:active{background:var(--tint)}
.stepper .val{min-width:74px;text-align:center;font-size:22px;font-weight:700;color:var(--deep)}
.stepper .val small{font-size:12px;font-weight:400;color:var(--muted);margin-left:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{font:inherit;font-size:13.5px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer}
.chips button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.chips button.on.warn{background:var(--warn);border-color:var(--warn)}
.timeinput{font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #EEF4F1}
.row:last-child{border-bottom:none}
.row .lb{flex:1;font-size:14px}
.sw{flex:0 0 auto;width:48px;height:29px;border-radius:999px;background:#DCE7E2;border:none;position:relative;cursor:pointer;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.18);transition:.15s}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(19px)}
textarea{width:100%;font:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:10px;
  resize:vertical;min-height:62px;background:#fff;color:var(--ink)}
.saved{text-align:center;font-size:12.5px;color:var(--muted);padding:6px 0 2px;min-height:20px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;border:none;background:none;font:inherit;font-size:11.5px;color:var(--muted);
  padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabbar button .ic{font-size:19px;line-height:1.1;filter:grayscale(1);opacity:.55}
.tabbar button.on{color:var(--green);font-weight:600}
.tabbar button.on .ic{filter:none;opacity:1}
.stats{display:flex;gap:10px;text-align:center}
.stats > div{flex:1;background:var(--tint);border-radius:12px;padding:10px 6px}
.stats b{display:block;font-size:21px;color:var(--deep);line-height:1.2}
.stats span{font-size:11.5px;color:var(--muted)}
.verdict{border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.6}
.verdict.good{background:#EDF7F2;color:#1B6B52}
.verdict.flat{background:#F4F6F5;color:#4C5C58}
.verdict.bad{background:var(--warntint);color:#8F4520}
.verdict b{color:inherit}
.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:6px;justify-content:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #EEF4F1;cursor:pointer}
.item:last-child{border-bottom:none}
.item .d{flex:1;min-width:0}
.item .d b{display:block;font-size:14px;font-weight:600}
.item .d span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .badge{flex:0 0 auto;font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--tint);color:var(--deep);font-weight:600}
.item .badge.bad{background:var(--warntint);color:#8F4520}
.item .badge.none{background:#F0F2F1;color:#9AA6A2;font-weight:400}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 10px;line-height:1.7}
.btns{display:flex;gap:9px;flex-wrap:wrap}
.btns button{flex:1;min-width:130px;font:inherit;font-size:13.5px;padding:11px 10px;border-radius:11px;
  border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.btns button.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.btns button.danger{color:var(--warn);border-color:#EBCFC1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:rgba(20,81,63,.94);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.22s;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.65;margin:8px 0 0}
.redcard{background:var(--warntint);border-color:#EBCFC1}
.redcard .sec{color:#9C4A25}
.redcard .sec::before{background:var(--warn)}
.redcard ul{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:#7C4622}
.sheet{position:fixed;inset:0;background:rgba(15,35,30,.42);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet .inner{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  max-height:86vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:16px;color:var(--deep)}
.kv{font-size:14px;padding:7px 0;border-bottom:1px solid #EEF4F1;display:flex;gap:10px}
.kv span{color:var(--muted);flex:0 0 84px}
.kv b{font-weight:500;flex:1;word-break:break-all}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="inner" id="sheetInner"></div></div>

<script>
(function(){
"use strict";
var KEY = "ruyuan.records.v1";
var TABS = ["today","trend","list"];
var _h = (location.hash||"").replace("#","");
var state = { tab: TABS.indexOf(_h)>=0 ? _h : "today", date: todayStr() };

var SENT = [["self","自己进去"],["need","要哄一会"],["cry","大哭不让走"]];
var MOOD = [["good","好"],["ok","一般"],["bad","差"]];
var EAT  = [["normal","正常"],["soso","一般"],["bad","很差"]];
var CRY  = [0,5,10,15,20,30,45,60];
var SYMPTOMS = ["腹痛","呕吐","发热","腹泻","打鼾憋气","说梦话","尿床"];
var ROUTINE = [
  ["noScreen","睡前 1 小时没看屏幕"],
  ["order","洗澡 → 绘本 → 关灯，顺序一样"],
  ["noTalk","睡前没聊幼儿园的事"],
  ["comfort","安抚物放在床边"],
  ["calmNight","夜里轻拍安抚，没抱起走动"]
];

/* ---------- 存储 ---------- */
function loadAll(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function saveAll(o){ try { localStorage.setItem(KEY, JSON.stringify(o)); return true; } catch(e){ toast("保存失败，请检查浏览器设置"); return false; } }
var db = loadAll();

function blank(date){
  return { date:date, sent:null, cry:null, wake:null, mood:null, eat:null,
           symptoms:[], routine:{}, lightsOut:"", note:"" };
}
function get(date){ return db[date] || blank(date); }
function set(date, patch){
  var r = get(date);
  for (var k in patch) r[k] = patch[k];
  db[date] = r;
  if (saveAll(db)) flash();
  return r;
}
function remove(date){ delete db[date]; saveAll(db); }
function recorded(){ return Object.keys(db).filter(function(d){ return hasAny(db[d]); }); }
function hasAny(r){
  return !!(r && (r.sent || r.cry !== null && r.cry !== undefined || r.wake !== null && r.wake !== undefined ||
    r.mood || r.eat || (r.symptoms && r.symptoms.length) || (r.note && r.note.trim()) ||
    r.lightsOut || Object.keys(r.routine || {}).some(function(k){ return r.routine[k]; })));
}

/* ---------- 工具 ---------- */
function pad(n){ return n<10 ? "0"+n : ""+n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function shiftDate(s, delta){
  var p = s.split("-").map(Number);
  var d = new Date(p[0], p[1]-1, p[2]+delta);
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function label(s){
  var p = s.split("-").map(Number);
  var d = new Date(p[0], p[1]-1, p[2]);
  var w = "日一二三四五六".charAt(d.getDay());
  var t = todayStr();
  var pre = s===t ? "今天 · " : (s===shiftDate(t,-1) ? "昨天 · " : "");
  return pre + (p[1]) + "月" + p[2] + "日 周" + w;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function labelOf(list, key){ for (var i=0;i<list.length;i++) if (list[i][0]===key) return list[i][1]; return "—"; }
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove("show"); }, 1500);
}
var _ft;
function flash(){ var el=document.getElementById("toast"); }
function savedFlash(){ clearTimeout(_ft); var el=document.getElementById("toast");
  el.textContent="已记录 ✓"; el.classList.add("show");
  _ft=setTimeout(function(){ el.classList.remove("show"); },1100); }

/* ---------- 渲染 ---------- */
function render(){
  var app = document.getElementById("app");
  var html = "";
  if (state.tab === "today") html = viewToday();
  else if (state.tab === "trend") html = viewTrend();
  else html = viewList();
  app.innerHTML = html;
  document.getElementById("tabbar").innerHTML =
    [["today","✍️","今天"],["trend","📈","趋势"],["list","📋","记录"]].map(function(t){
      return '<button data-tab="'+t[0]+'" class="'+(state.tab===t[0]?"on":"")+'"><span class="ic">'+t[1]+'</span>'+t[2]+'</button>';
    }).join("");
  window.scrollTo(0,0);
}

/* --- 今天 --- */
function viewToday(){
  var d = state.date, r = get(d);
  var h = '<div class="top"><h1>入园适应记录</h1><div class="sub">3 岁 · 分离焦虑与夜醒观察 · 点一下就能记</div></div>';

  h += '<div class="card"><div class="datepick">'
     + '<input type="date" id="dateInput" value="'+d+'">'
     + '<div class="seg" style="flex:0 0 auto"><button data-act="day" data-v="'+todayStr()+'" class="'+(d===todayStr()?"on":"")+'">今天</button>'
     + '<button data-act="day" data-v="'+shiftDate(todayStr(),-1)+'" class="'+(d===shiftDate(todayStr(),-1)?"on":"")+'">昨天</button></div>'
     + '</div>'
     + '<div class="sec">送园时的表现</div><div class="seg">'
     + SENT.map(function(o){ return '<button data-act="sent" data-v="'+o[0]+'" class="'+(r.sent===o[0]?"on":"")+'">'+o[1]+'</button>'; }).join("")
     + '</div></div>';

  h += '<div class="card"><div class="sec">早上哭闹了多久</div><div class="chips">'
     + CRY.map(function(v){ return '<button data-act="cry" data-v="'+v+'" class="'+(r.cry===v?"on":"")+'">'+(v>=60?"60 分钟以上":v+" 分钟")+'</button>'; }).join("")
     + '</div></div>';

  h += '<div class="card"><div class="sec">夜里醒了几次 <em>半夜醒来随手点一下</em></div>'
     + '<div class="stepper"><button data-act="wake" data-v="'+(wakeNum(r)-1)+'">−</button>'
     + '<div class="val">'+(r.wake===null||r.wake===undefined?'<span style="font-size:15px;font-weight:400;color:#7A8C87">还没记</span>':r.wake+'<small>次</small>')+'</div>'
     + '<button data-act="wake" data-v="'+(wakeNum(r)+1)+'">+</button></div></div>';

  h += '<div class="card"><div class="sec">白天精神</div><div class="seg">'
     + MOOD.map(function(o){ return '<button data-act="mood" data-v="'+o[0]+'" class="'+(r.mood===o[0]?"on":"")+'">'+o[1]+'</button>'; }).join("")
     + '</div><div class="sec" style="margin-top:16px">吃饭</div><div class="seg">'
     + EAT.map(function(o){ return '<button data-act="eat" data-v="'+o[0]+'" class="'+(r.eat===o[0]?"on":"")+'">'+o[1]+'</button>'; }).join("")
     + '</div></div>';

  h += '<div class="card"><div class="sec">身体上还有这些吗 <em>没有就不点</em></div><div class="chips">'
     + SYMPTOMS.map(function(s){ var on = r.symptoms.indexOf(s)>=0;
         return '<button data-act="sym" data-v="'+s+'" class="'+(on?"on warn":"")+'">'+s+'</button>'; }).join("")
     + '</div></div>';

  h += '<div class="card"><div class="sec">睡前固定流程 <em>做到了就点亮</em></div>'
     + ROUTINE.map(function(o){
         var on = !!(r.routine && r.routine[o[0]]);
         return '<div class="row"><div class="lb">'+o[1]+'</div><button class="sw '+(on?"on":"")+'" data-act="rt" data-v="'+o[0]+'"></button></div>';
       }).join("")
     + '<div class="row"><div class="lb">关灯时间</div><input class="timeinput" type="time" id="lightsOut" value="'+(r.lightsOut||"")+'"></div>'
     + '</div>';

  h += '<div class="card"><div class="sec">备注 <em>夜里怎么处理的、老师说了什么</em></div>'
     + '<textarea id="note" placeholder="例如：凌晨 2 点醒了要抱，轻拍 10 分钟后睡着">'+esc(r.note)+'</textarea>'
     + '<div class="saved" id="savedTip">'+(hasAny(r)?"这一天已记录，改动会自动保存":"填过的内容会自动保存在这台手机上")+'</div></div>';

  h += '<div class="card flat redcard"><div class="sec">出现这些，尽快面诊</div><ul>'
     + '<li>明显超过 2 周没好转，或在加重</li>'
     + '<li><b>白天也精神差</b>、退缩不和群、不说话</li>'
     + '<li>体重不增甚至下降，反复腹痛、呕吐</li>'
     + '<li>夜里醒得极频繁，或打鼾憋气、张口呼吸</li></ul>'
     + '<div class="hint">挂号：儿童保健科 / 发育行为儿科，有儿童睡眠门诊更好。去之前把趋势页给医生看。</div></div>';

  return h;
}
function wakeNum(r){ return (r.wake===null||r.wake===undefined) ? 0 : r.wake; }

/* --- 趋势 --- */
function viewTrend(){
  var days = [], t = todayStr();
  for (var i=13;i>=0;i--) days.push(shiftDate(t,-i));
  var rows = days.map(function(d){ return { d:d, r:db[d] || null }; })
                 .filter(function(x){ return x.r && hasAny(x.r); });

  var h = '<div class="top"><h1>最近的情况</h1><div class="sub">看趋势比看单天重要，连续记 7～14 天最有用</div></div>';

  if (rows.length === 0){
    return h + '<div class="card"><div class="empty">还没有记录<br>去「今天」页填第一条，这里就会出现趋势图</div></div>';
  }

  var wakes = rows.filter(function(x){ return x.r.wake!==null && x.r.wake!==undefined; });
  var crys  = rows.filter(function(x){ return x.r.cry!==null && x.r.cry!==undefined; });
  var avgWake = wakes.length ? (wakes.reduce(function(a,b){ return a+b.r.wake; },0)/wakes.length) : 0;
  var badMood = rows.filter(function(x){ return x.r.mood==="bad"; }).length;

  h += '<div class="card"><div class="stats">'
     + '<div><b>'+rows.length+'</b><span>已记录天数</span></div>'
     + '<div><b>'+(wakes.length?avgWake.toFixed(1):"—")+'</b><span>平均夜醒（次）</span></div>'
     + '<div><b>'+badMood+'</b><span>白天精神差（天）</span></div>'
     + '</div></div>';

  h += '<div class="card"><div class="sec">夜醒次数 <em>越低越好</em></div>'
     + barChart(rows, function(x){ return x.r.wake; }, 4, "#2E7D6B")
     + '<div class="legend"><span><i style="background:#2E7D6B"></i>夜醒次数</span></div></div>';

  h += '<div class="card"><div class="sec">早上哭闹时长 <em>分钟</em></div>'
     + barChart(rows, function(x){ return x.r.cry; }, 30, "#C2703D")
     + '<div class="legend"><span><i style="background:#C2703D"></i>哭闹分钟数</span></div></div>';

  h += '<div class="card">' + verdict(rows) + '</div>';

  h += '<div class="card flat"><div class="sec">这段时间的汇总</div>'
     + '<div class="kv"><span>白天精神好</span><b>'+rows.filter(function(x){return x.r.mood==="good";}).length+' 天</b></div>'
     + '<div class="kv"><span>白天精神差</span><b>'+badMood+' 天</b></div>'
     + '<div class="kv"><span>自己走进园</span><b>'+rows.filter(function(x){return x.r.sent==="self";}).length+' 天</b></div>'
     + '<div class="kv"><span>大哭不让走</span><b>'+rows.filter(function(x){return x.r.sent==="cry";}).length+' 天</b></div>'
     + '<div class="kv"><span>出现身体症状</span><b>'+rows.filter(function(x){return x.r.symptoms && x.r.symptoms.length;}).length+' 天</b></div>'
     + '<div class="kv" style="border:none"><span>睡前流程</span><b>平均每天做到 '+avgRoutine(rows).toFixed(1)+' / 5 项</b></div>'
     + '</div>';
  return h;
}

function avgRoutine(rows){
  if (!rows.length) return 0;
  var s = rows.reduce(function(a,x){
    var c = ROUTINE.filter(function(o){ return x.r.routine && x.r.routine[o[0]]; }).length;
    return a + c; }, 0);
  return s / rows.length;
}

function verdict(rows){
  if (rows.length < 3){
    return '<div class="verdict flat">多记几天就能看出趋势了，目前已有 <b>'+rows.length+'</b> 天记录。</div>';
  }
  var half = Math.floor(rows.length/2);
  var early = rows.slice(0, half).filter(function(x){ return typeof x.r.wake === "number"; });
  var late  = rows.slice(-half).filter(function(x){ return typeof x.r.wake === "number"; });
  var ae = early.length ? early.reduce(function(a,b){return a+b.r.wake;},0)/early.length : 0;
  var al = late.length ? late.reduce(function(a,b){return a+b.r.wake;},0)/late.length : 0;
  var diff = ae - al;
  var cls, txt;
  if (diff >= 0.7){
    cls = "good";
    txt = "夜醒在往好的方向走（前期平均 <b>"+ae.toFixed(1)+"</b> 次 → 最近 <b>"+al.toFixed(1)+"</b> 次）。保持现在的睡前流程和分离仪式，不用加码。";
  } else if (diff <= -0.7){
    cls = "bad";
    txt = "夜醒在变多（前期平均 <b>"+ae.toFixed(1)+"</b> 次 → 最近 <b>"+al.toFixed(1)+"</b> 次）。先排查：是不是睡得太晚、睡前看了屏幕、或被白天的事刺激。若已持续两周以上，建议面诊。";
  } else {
    cls = "flat";
    txt = "夜醒次数基本持平（前期 <b>"+ae.toFixed(1)+"</b> 次 → 最近 <b>"+al.toFixed(1)+"</b> 次）。多数孩子在 2～4 周内会慢慢稳定，继续按现在的节奏做。";
  }
  var reds = [];
  if (rows.length >= 7 && diff <= -0.7) reds.push("连着 7 天以上没有好转");
  var bads = rows.filter(function(x){ return x.r.mood==="bad"; }).length;
  if (bads / rows.length >= 0.6) reds.push("白天精神差的天数偏多");
  if (rows.some(function(x){ return x.r.symptoms && (x.r.symptoms.indexOf("呕吐")>=0 || x.r.symptoms.indexOf("发热")>=0); }))
    reds.push("出现过呕吐或发热");
  if (reds.length){
    txt += '<div class="hint" style="color:inherit;margin-top:8px">提醒：' + reds.join("；") + '。建议尽快去儿童保健科 / 发育行为儿科，把这页给医生看。</div>';
  }
  return '<div class="verdict '+cls+'">'+txt+'</div>';
}

function barChart(rows, get, floor, color){
  var vals = rows.map(get).filter(function(v){ return typeof v==="number" && !isNaN(v); });
  var obs = vals.length ? Math.max.apply(null, vals) : floor;
  var max = Math.max(floor, Math.ceil(obs*1.15));
  var n = Math.max(rows.length, 1);
  var W = 340, H = 130, padB = 20, padT = 8, padL = 4, padR = 4;
  var iw = (W - padL - padR) / n;
  var bw = Math.min(iw * 0.62, 26);
  var s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:132px">';
  [0, .5, 1].forEach(function(f){
    var y = padT + (H - padB - padT) * f;
    s += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#E6EEEA" stroke-width="1"/>';
  });
  rows.forEach(function(x, i){
    var v = get(x);
    var cx = padL + iw * i + iw/2;
    var has = (typeof v === "number" && !isNaN(v));
    var hgt = has ? Math.max((H - padB - padT) * Math.min(v / max, 1), 2) : 0;
    var y = H - padB - hgt;
    if (has && hgt > 0){
      s += '<rect x="'+(cx-bw/2)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+hgt.toFixed(1)+'" rx="3" fill="'+color+'" opacity=".85"/>';
      s += '<text x="'+cx+'" y="'+(y-4).toFixed(1)+'" font-size="9" fill="#5E6F6A" text-anchor="middle">'+v+'</text>';
    } else {
      s += '<rect x="'+(cx-bw/2)+'" y="'+(H-padB-2)+'" width="'+bw+'" height="2" rx="1" fill="#DDE6E2"/>';
    }
    var p = x.d.split("-").map(Number);
    s += '<text x="'+cx+'" y="'+(H-6)+'" font-size="9" fill="#9AA9A4" text-anchor="middle">'+p[1]+'/'+p[2]+'</text>';
  });
  s += '</svg>';
  return s;
}

/* --- 记录列表 --- */
function viewList(){
  var ds = recorded().sort().reverse();
  var h = '<div class="top"><h1>全部记录</h1><div class="sub">点任意一条可以查看或修改</div></div>';
  h += '<div class="card">';
  if (!ds.length){
    h += '<div class="empty">还没有记录<br>去「今天」页开始记第一条</div>';
  } else {
    h += ds.map(function(d){
      var r = db[d];
      var bits = [];
      if (r.sent) bits.push(labelOf(SENT, r.sent));
      if (typeof r.wake === "number") bits.push("夜醒 "+r.wake+" 次");
      if (typeof r.cry === "number") bits.push("哭闹 "+r.cry+" 分");
      var cls = (r.mood==="bad" || (typeof r.wake==="number" && r.wake>=3)) ? "bad" : "";
      var tag = r.mood==="bad" ? "精神差" : (typeof r.wake==="number" ? "夜醒 "+r.wake+" 次" : "已记录");
      return '<div class="item" data-act="open" data-v="'+d+'"><div class="d"><b>'+label(d)+'</b><span>'
        + (bits.length?bits.join(" · "):"只填了一部分") + '</span></div><div class="badge '+cls+'">'+tag+'</div></div>';
    }).join("");
  }
  h += '</div>';

  h += '<div class="card flat"><div class="sec">数据放在哪里</div>'
     + '<div class="hint">所有记录只保存在你自己的这台手机上，不上传、不联网。'
     + '换手机或清缓存前，建议先导出一份备份。</div>'
     + '<div class="btns" style="margin-top:12px">'
     + '<button class="primary" data-act="csv">导出表格（给医生看）</button>'
     + '<button data-act="backup">备份到文件</button></div>'
     + '<div class="btns" style="margin-top:9px">'
     + '<button data-act="restore">从备份恢复</button>'
     + '<button class="danger" data-act="clear">清空全部记录</button></div>'
     + '<input type="file" id="fileInput" accept=".json,application/json" style="display:none">'
     + '</div>';

  h += '<div class="card flat"><div class="sec">怎么安装到手机桌面</div>'
     + '<div class="hint"><b>iPhone：</b>用 Safari 打开 → 点底部「分享」→ 选「添加到主屏幕」。<br>'
     + '<b>安卓：</b>用 Chrome 打开 → 右上角菜单 → 选「添加到主屏幕」。<br>'
     + '加完之后桌面会多一个图标，点开就是全屏 App，断网也能用。</div></div>';
  return h;
}

/* ---------- 详情弹层 ---------- */
function openSheet(d){
  var r = get(d);
  var rowsHtml = '';
  function kv(k, v){ rowsHtml += '<div class="kv"><span>'+k+'</span><b>'+esc(v)+'</b></div>'; }
  kv("日期", label(d));
  kv("送园表现", r.sent ? labelOf(SENT, r.sent) : "—");
  kv("哭闹时长", (typeof r.cry==="number") ? r.cry+" 分钟" : "—");
  kv("夜里醒来", (typeof r.wake==="number") ? r.wake+" 次" : "—");
  kv("白天精神", r.mood ? labelOf(MOOD, r.mood) : "—");
  kv("吃饭", r.eat ? labelOf(EAT, r.eat) : "—");
  kv("身体症状", (r.symptoms && r.symptoms.length) ? r.symptoms.join("、") : "无");
  kv("关灯时间", r.lightsOut || "—");
  var rt = ROUTINE.filter(function(o){ return r.routine && r.routine[o[0]]; })
                 .map(function(o){ return o[1].split("，")[0]; });
  kv("睡前流程", rt.length ? rt.join(" / ") : "—");
  kv("备注", r.note || "—");

  document.getElementById("sheetInner").innerHTML =
    '<h3>'+label(d)+'</h3>'+rowsHtml+
    '<div class="btns" style="margin-top:14px">'+
    '<button class="primary" data-act="edit" data-v="'+d+'">去修改</button>'+
    '<button class="danger" data-act="del" data-v="'+d+'">删除这天</button>'+
    '<button data-act="closesheet">关闭</button></div>';
  document.getElementById("sheet").classList.add("show");
}
function closeSheet(){ document.getElementById("sheet").classList.remove("show"); }

/* ---------- 导出 ---------- */
function csvText(){
  var head = ["日期","星期","送园表现","哭闹分钟","夜醒次数","白天精神","吃饭","身体症状","关灯时间","睡前流程完成","备注"];
  var lines = [head.join(",")];
  recorded().sort().forEach(function(d){
    var r = db[d], p = d.split("-").map(Number);
    var w = "日一二三四五六".charAt(new Date(p[0],p[1]-1,p[2]).getDay());
    var rc = ROUTINE.filter(function(o){ return r.routine && r.routine[o[0]]; }).length;
    var cells = [d, w, r.sent?labelOf(SENT,r.sent):"", (typeof r.cry==="number")?r.cry:"",
                 (typeof r.wake==="number")?r.wake:"", r.mood?labelOf(MOOD,r.mood):"",
                 r.eat?labelOf(EAT,r.eat):"", (r.symptoms||[]).join("/"), r.lightsOut||"",
                 rc+"/5", (r.note||"").replace(/[\r\n,]+/g," ")];
    lines.push(cells.join(","));
  });
  return "\ufeff" + lines.join("\r\n");
}
function download(name, text, mime){
  try{
    var blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    var file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      navigator.share({ files:[file], title:name }).catch(function(){ fallback(); });
    } else fallback();
    function fallback(){
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 400);
      toast("已导出 " + name);
    }
  } catch(e){ toast("导出失败：" + e.message); }
}

/* ---------- 事件 ---------- */
document.addEventListener("click", function(ev){
  var btn = ev.target.closest("[data-act]");
  if (!btn) return;
  var act = btn.getAttribute("data-act");
  var v = btn.getAttribute("data-v");
  var d = state.date;

  if (act === "day"){ state.date = v; render(); return; }
  if (act === "sent"){ set(d, { sent: get(d).sent===v ? null : v }); render(); return; }
  if (act === "cry"){
    var cv = Number(v); set(d, { cry: get(d).cry===cv ? null : cv }); render(); return; }
  if (act === "wake"){
    var n = Math.max(0, Math.min(15, Number(v)));
    set(d, { wake: n }); render(); return; }
  if (act === "mood"){ set(d, { mood: get(d).mood===v ? null : v }); render(); return; }
  if (act === "eat"){ set(d, { eat: get(d).eat===v ? null : v }); render(); return; }
  if (act === "sym"){
    var r0 = get(d), arr = r0.symptoms.slice();
    var i = arr.indexOf(v);
    if (i >= 0) arr.splice(i,1); else arr.push(v);
    set(d, { symptoms: arr }); render(); return; }
  if (act === "rt"){
    var r1 = get(d), o = {};
    for (var k in r1.routine) o[k] = r1.routine[k];
    o[v] = !o[v]; set(d, { routine:o }); render(); return; }
  if (act === "open"){ openSheet(v); return; }
  if (act === "edit"){ state.date = v; state.tab = "today"; closeSheet(); render(); return; }
  if (act === "del"){
    if (confirm("确定删除 " + label(v) + " 的记录吗？")){ remove(v); closeSheet(); render(); toast("已删除"); }
    return; }
  if (act === "closesheet"){ closeSheet(); return; }
  if (act === "csv"){ download("入园适应记录.csv", csvText(), "text/csv;charset=utf-8"); return; }
  if (act === "backup"){
    download("入园适应记录-备份.json", JSON.stringify({ v:1, savedAt:new Date().toISOString(), records:db }, null, 2), "application/json");
    return; }
  if (act === "restore"){ document.getElementById("fileInput").click(); return; }
  if (act === "clear"){
    if (confirm("清空全部记录？这个操作无法撤销，建议先备份。")){
      db = {}; saveAll(db); render(); toast("已清空"); }
    return; }
});

document.addEventListener("click", function(ev){
  var t = ev.target.closest(".tabbar button");
  if (t){ state.tab = t.getAttribute("data-tab"); if (location.hash !== "#"+state.tab) history.replaceState(null,"","#"+state.tab); render(); }
});
document.getElementById("sheet").addEventListener("click", function(ev){
  if (ev.target.id === "sheet") closeSheet();
});

document.addEventListener("change", function(ev){
  if (ev.target.id === "dateInput" && ev.target.value){ state.date = ev.target.value; render(); }
  if (ev.target.id === "lightsOut"){ set(state.date, { lightsOut: ev.target.value }); savedFlash(); }
});
document.addEventListener("input", function(ev){
  if (ev.target.id === "note"){
    var r = get(state.date); r.note = ev.target.value; db[state.date] = r; saveAll(db); savedFlash();
  }
});
document.addEventListener("change", function(ev){
  if (ev.target.id === "fileInput" && ev.target.files && ev.target.files[0]){
    var f = ev.target.files[0], fr = new FileReader();
    fr.onload = function(){
      try{
        var data = JSON.parse(fr.result);
        var recs = data.records || data;
        var cnt = 0;
        for (var k in recs){ if (/^\d{4}-\d{2}-\d{2}$/.test(k)){ db[k] = recs[k]; cnt++; } }
        saveAll(db); render(); toast("已恢复 " + cnt + " 天记录");
      } catch(e){ toast("备份文件读不出来"); }
    };
    fr.readAsText(f);
  }
});

window.addEventListener("hashchange", function(){
  var x = (location.hash||"").replace("#","");
  if (TABS.indexOf(x)>=0 && x !== state.tab){ state.tab = x; render(); }
});
render();
/* 离线可用：注册 Service Worker（只在 https 上启用） */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
})();
</script>
